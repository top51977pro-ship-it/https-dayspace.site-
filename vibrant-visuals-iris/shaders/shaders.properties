# Vibrant Visuals for Java - Iris shader pack properties

# Terrain: gl_Color.rgb = biome tint, gl_Color.a = vanilla ambient occlusion
separateAo = true

# We draw our own sky gradient, sun glow and fog
sun = true
moon = true
fog = off
oldLighting = false
underwaterOverlay = false
vignette = false
dynamicHandLight = true
frustum.culling = true
shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true

# Note: gbuffers that write colortex1 always output alpha = 1 there, so the
# normal alpha blending of translucents simply replaces the data.

# ---------------------------------------------------------------- menu
screen = <profile> <empty> [LIGHTING] [SHADOWS] [SKY] [ATMOSPHERE] [WATER] [POST]
screen.columns = 2

screen.LIGHTING = SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS NIGHT_BRIGHTNESS \
  EMISSIVE_STRENGTH SUBSURFACE_SCATTERING WAVING_PLANTS WAVING_STRENGTH

screen.SHADOWS = BLOCKY_SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation

screen.SKY = SUN_GLOW SUN_DISC_BRIGHTNESS STAR_BRIGHTNESS CLOUD_OPACITY

screen.ATMOSPHERE = VOLUMETRIC_LIGHT VL_SAMPLES VL_STRENGTH FOG_DENSITY MORNING_FOG

screen.WATER = WATER_REFLECTIONS WATER_CAUSTICS PIXELATED_WATER WATER_WAVE_STRENGTH \
  WATER_CLARITY WATER_SPARKLE

screen.POST = BLOOM BLOOM_STRENGTH AUTO_EXPOSURE EXPOSURE CONTRAST SATURATION VIBRANCE

sliders = shadowMapResolution shadowDistance sunPathRotation SHADOW_SAMPLES SHADOW_SOFTNESS \
  SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS NIGHT_BRIGHTNESS EMISSIVE_STRENGTH \
  WAVING_STRENGTH SUN_GLOW SUN_DISC_BRIGHTNESS STAR_BRIGHTNESS CLOUD_OPACITY VL_SAMPLES VL_STRENGTH \
  FOG_DENSITY MORNING_FOG WATER_WAVE_STRENGTH WATER_CLARITY WATER_SPARKLE BLOOM_STRENGTH EXPOSURE \
  CONTRAST SATURATION VIBRANCE

# ---------------------------------------------------------------- profiles
profile.LOW    = shadowMapResolution=1024 shadowDistance=96.0 SHADOW_SAMPLES=1 !VOLUMETRIC_LIGHT !WATER_REFLECTIONS
profile.MEDIUM = shadowMapResolution=1536 shadowDistance=128.0 SHADOW_SAMPLES=4 VOLUMETRIC_LIGHT VL_SAMPLES=12 WATER_REFLECTIONS
profile.HIGH   = shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=4 VOLUMETRIC_LIGHT VL_SAMPLES=16 WATER_REFLECTIONS
profile.ULTRA  = shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=16 VOLUMETRIC_LIGHT VL_SAMPLES=32 WATER_REFLECTIONS
