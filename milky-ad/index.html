<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="23"
      data-width="1920"
      data-height="1080"
    >
      <!-- 3D world: ground colour + real-textured Milky cup (Three.js) -->
      <div
        id="stage"
        data-composition-id="stage"
        data-composition-src="compositions/stage.html"
        data-start="0"
        data-duration="23"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>

      <!-- Copy, one scene per beat, above the 3D world -->
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="2.6"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="lines"
        data-composition-id="lines"
        data-composition-src="compositions/lines.html"
        data-start="3.6"
        data-duration="6.2"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="slot"
        data-composition-id="slot"
        data-composition-src="compositions/slot.html"
        data-start="11"
        data-duration="3.9"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="swarm"
        data-composition-id="swarm"
        data-composition-src="compositions/swarm.html"
        data-start="15"
        data-duration="2.4"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="17.6"
        data-duration="5.4"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="23" data-track-index="3" data-volume="0.8"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="23" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
