# DonutClassic main configuration.
# Values marked APPROX are community-style defaults, NOT verified official values. See HISTORICAL_ACCURACY.md.

# classic-early | feb-2026 | post-2026   (files in presets/). Switch in-game with /dc preset <name>.
preset: classic-early
locale: en            # messages_<locale>.yml; add your own translation file, missing keys fall back to English

worlds:
  spawn-world: spawn          # default target world for /dc map paste (created as an empty void world)
  void-worlds: []             # void worlds loaded on startup (filled automatically by /dc map paste)
  paste-base-y: 0             # default Y of the schematic's lowest layer
  paste-ms-per-tick: 30       # time budget per tick while pasting (keeps the server responsive)
  # Maps shipped inside the jar (bundled-maps/) or placed in plugins/DonutClassic/maps are pasted ONCE on startup.
  auto-paste-bundled: true
  bundled:
    spawn: {file: spawn.litematic, world: spawn, role: spawn}            # centred on 0,0
    afk:   {file: afk.litematic,   world: spawn, at: [400, 0, -50], role: afk}

# World borders applied on every startup and /dc reload. Sizes are the full width in blocks (diameter).
# Sizes reported for DonutSMP (unverified, from an AI answer; no official source found). Change with /dc border <world> <size>.
world-border:
  enabled: true
  warning-distance: 32
  damage-amount: 0.2
  damage-buffer: 5
  worlds:
    world:         {center-x: 0, center-z: 0, size: 225000}   # 225,000 x 225,000
    world_nether:  {center-x: 0, center-z: 0, size: 57000}    # 57,000 x 57,000
    world_the_end: {center-x: 0, center-z: 0, size: 175000}   # 175,000 x 175,000
    spawn:         {center-x: 0, center-z: 0, size: 1500}     # void spawn world: just around the build

moderation:
  default-reason: 'Breaking the rules'
  appeal-text: 'Appeal on our Discord.'
  deny-login-on-error: false

# Server-side checks. Alerts go to dc.staff + the mobile panel; players can be set back and kicked.
# Nothing is ever banned automatically. Bedrock (Geyser) players get relaxed limits.
anticheat:
  enabled: true
  kick-enabled: true
  setback: true
  vl-decay-per-second: 0.05
  kick-message: '&cUnfair advantage detected. If this is a mistake, contact staff.'
  antixray:
    auto-configure: true     # turns on Paper's engine anti-xray (restart required once)
  checks:
    fly:         {enabled: true, max-rise-moves: 12, bedrock-max-rise-moves: 20, alert-vl: 4, kick-vl: 20}
    speed:       {enabled: true, max-bps: 13.5, bedrock-max-bps: 16, alert-vl: 6, kick-vl: 30}
    reach:       {enabled: true, max: 3.6, bedrock-max: 4.6, alert-vl: 5, kick-vl: 25}
    killaura:    {enabled: true, max-angle: 95, alert-vl: 5, kick-vl: 25}
    autoclicker: {enabled: true, max-cps: 22, alert-vl: 3, kick-vl: 15}
    fastbreak:   {enabled: true, max-per-second: 9, alert-vl: 4, kick-vl: 20}
    xray:        {enabled: true, window-minutes: 20, min-ores: 10, max-ratio: 0.04, alert-vl: 1, kick-vl: 1000}

# JSON snapshots for the mobile admin app (plugins/DonutClassic/panel/*.json)
panel:
  enabled: true
  interval-seconds: 30

menus:
  click-debounce-ms: 250   # ignores double clicks / Bedrock double taps inside menus

spawn:
  teleport-on-first-join: true
  teleport-on-join: true      # everyone joins at /spawn (DonutSMP style)
  respawn-at-spawn: true

regions:
  protect-afk: true         # AFK region gets the same protection as spawn
  allow-containers: false   # allow opening chests etc. inside spawn
  void-return-depth: 10     # blocks below world min height before returning to spawn

teleport:
  warmup-seconds: 5         # DOCUMENTED classic behaviour (instant only after the late-June-2026 update)
  tpa-expire-seconds: 60
  back-enabled: true

homes:
  default-max: 2            # DOCUMENTED classic default. dc.homes.<n> raises it (ranks are free/admin only)

rtp:
  attempts: 12
  cooldown-seconds: 30      # APPROX
  min-radius: 500           # APPROX
  max-radius: 100000        # APPROX (inside the 112,500 overworld border radius)
  worlds:
    overworld: world
    nether: world_nether
    end: world_the_end
  nether:
    min-radius: 500
    max-radius: 25000       # inside the 28,500 nether border radius
  end:
    min-radius: 1000        # outer End islands
    max-radius: 4000

scoreboard:
  enabled: true
  refresh-ticks: 40
  title: '&b&lDonutClassic'
  lines:
    - '&7&m----------------'
    - '&fMoney: &a{money}'
    - '&fShards: &d{shards}'
    - '&fKills: &c{kills}'
    - '&fDeaths: &7{deaths}'
    - '&fPlaytime: &e{playtime}'
    - '&fTeam: &b{team}'
    - '&fKeyall: &6{keyall}'
    - '&fCombat: &c{combat}'
    - '&7&m---------------- '

tablist:
  show-rank-prefix: true

chat:
  format: '{team}{prefix}&f%1$s&7: &f%2$s'
  min-interval-ms: 1500
  duplicate-window-ms: 10000

announcements:
  interval-seconds: 300
  messages:
    - '&b[DonutClassic] &fAFK at &e/afk &fto earn &d1 Shard per minute&f.'
    - '&b[DonutClassic] &fEvery hour every online player gets a &eCommon key&f.'
    - '&b[DonutClassic] &fSell items with &e/sell&f, trade on &e/ah &fand &e/orders&f.'

# NPC actions created with /dc setnpc <id>; clicking runs the command as the player.
npcs:
  shop: {name: '&a&lShop', command: shop}
  shardshop: {name: '&d&lShard Shop', command: shardshop}
  crates: {name: '&6&lCrates', command: crates}
  rtp: {name: '&e&lRandom Teleport', command: rtp}
  duels: {name: '&c&lDuels', command: duel}
  afk: {name: '&b&lAFK Area', command: afk}
  ah: {name: '&e&lAuction House', command: ah}
  orders: {name: '&e&lOrders', command: orders}

# Shard tools (given via /dc tool give, the shard shop or crates). kind: area3x3 | treefeller | drain
tools:
  shard_pickaxe:
    kind: area3x3
    material: NETHERITE_PICKAXE
    name: '&d&lShard Pickaxe'
    lore: ['&7Mines a 3x3 area.', '&8Sneak to mine one block.']
    enchants: {efficiency: 5, unbreaking: 3}
  shard_shovel:
    kind: area3x3
    material: NETHERITE_SHOVEL
    name: '&d&lShard Shovel'
    lore: ['&7Digs a 3x3 area.', '&8Sneak to dig one block.']
    enchants: {efficiency: 5, unbreaking: 3}
  shard_axe:
    kind: treefeller
    material: NETHERITE_AXE
    name: '&d&lShard Axe'
    lore: ['&7Fells whole trees.', '&8Sneak to cut one log.']
    max-logs: 128
    enchants: {efficiency: 5, unbreaking: 3}
  amethyst_bucket:
    kind: drain
    material: BUCKET
    name: '&5&lAmethyst Bucket'
    lore: ['&7Right-click to drain nearby water.']
    radius: 2               # APPROX - drains a (2r+1)^3 cube
    cooldown-seconds: 5
