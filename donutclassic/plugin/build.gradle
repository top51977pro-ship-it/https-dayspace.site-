// Paper plugin. Compiled against the OLDEST supported API (1.20.1, Java 17) so it runs on 1.20.1 -> newest Paper.
def paperApi = findProperty('paperApi') ?: '1.20.1-R0.1-SNAPSHOT'
dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApi}"
    implementation project(':core')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand(version: project.version) }
}
jar {
    archiveBaseName = 'DonutClassic'
    archiveVersion = ''
    from { project(':core').sourceSets.main.output }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.register('dist', Copy) {
    dependsOn jar
    from jar.archiveFile
    into rootProject.file('dist')
}
