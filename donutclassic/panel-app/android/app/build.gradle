plugins { id 'com.android.application' }

android {
    namespace 'net.donutclassic.panel'
    compileSdk 34
    defaultConfig {
        applicationId 'net.donutclassic.panel'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { }
