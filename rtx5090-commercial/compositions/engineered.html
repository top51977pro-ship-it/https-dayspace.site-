<template>
  <style>
      @font-face { font-family: "Inter HF"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
    #root { position: absolute; inset: 0; font-family: "Inter HF"; color: var(--ink, #f2f3f5); -webkit-font-smoothing: antialiased; }
    #root .w, #root .ch { display: inline-block; }
    #eng-wrap { position: absolute; left: 168px; top: 812px; width: 1300px; }
    #eng-line { font-weight: 300; font-size: 58px; line-height: 1; letter-spacing: 0.3em; white-space: nowrap; text-shadow: 0 0 40px rgba(0,0,0,0.65); }
  </style>
  <div id="root" data-composition-id="engineered" data-width="1920" data-height="1080">
    <div id="eng-wrap"><div id="eng-line" data-var-text="line-engineered">ENGINEERED FOR POWER.</div></div>
  </div>
  <script>
      function splitChars(el, spreadPx) {
        // per-character spans grouped by word; each glyph carries its offset from the line centre
        const words = el.textContent.trim().split(/\s+/);
        el.innerHTML = words.map((w, wi) => `<span class="w">` + [...w].map((c) => `<span class="ch" data-w="${wi}">${c}</span>`).join("") + `</span>`).join(" ");
        const chars = [...el.querySelectorAll(".ch")];
        const mid = (chars.length - 1) / 2;
        chars.forEach((c, i) => (c.dataset.dx = ((i - mid) * spreadPx).toFixed(2)));
        return chars;
      }
      const tl = gsap.timeline({ paused: true });
      // local time 0 = 9.3 s in the film
      const chars = splitChars(document.getElementById("eng-line"), 1.6);
      tl.fromTo(chars, { opacity: 0, filter: "blur(14px)", x: (i, el) => +el.dataset.dx },
        { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.8, ease: "power3.out", stagger: (i, el) => +el.dataset.w * 0.14 }, 0.1);
      tl.to(chars, { opacity: 0, filter: "blur(10px)", duration: 0.35, ease: "power2.in", stagger: (i, el) => +el.dataset.w * 0.04 }, 2.62);
      window.__timelines["engineered"] = tl;
  </script>
</template>
