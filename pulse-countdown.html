<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Heebo:wght@400;500;700&display=swap">

<style>
/* ---------------------------------------------------------------------------
   Tokens. Dark-first: the bare :root carries the dark palette, and the light
   palette is mirrored into both the media query and the explicit stamp so all
   three viewer states (system / light / dark) resolve as a complete set.
   --------------------------------------------------------------------------- */
:root {
  --ground:      #07080F;
  --ground-2:    #0C0E18;
  --card:        #171A2B;
  --card-top:    #1E2136;
  --stroke:      rgba(255,255,255,.10);
  --stroke-firm: rgba(255,255,255,.18);
  --text:        #F4F5FA;
  --muted:       #9AA0B4;
  --violet:      #7C5CFF;
  --violet-soft: #9C86FF;
  --cyan:        #22D3EE;
  --rose:        #FF6B9D;
  --danger:      #FF7B7B;
  --wash-1:      rgba(124,92,255,.20);
  --wash-2:      rgba(34,211,238,.12);
  --btn-text:    #FFFFFF;
  --shadow:      0 24px 60px -24px rgba(0,0,0,.85);

  --step--1: .78rem;
  --step-0:  .95rem;
  --step-1:  1.15rem;
  --step-2:  1.55rem;
  --step-3:  2.1rem;

  --radius:    26px;
  --radius-sm: 16px;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground:      #F4F5FB;
    --ground-2:    #FFFFFF;
    --card:        #FFFFFF;
    --card-top:    #FFFFFF;
    --stroke:      rgba(18,20,31,.10);
    --stroke-firm: rgba(18,20,31,.18);
    --text:        #12141F;
    --muted:       #5C6377;
    --violet:      #5B3FD9;
    --violet-soft: #7C5CFF;
    --cyan:        #0E8CA8;
    --rose:        #D63C71;
    --danger:      #C0392B;
    --wash-1:      rgba(124,92,255,.14);
    --wash-2:      rgba(14,140,168,.10);
    --btn-text:    #FFFFFF;
    --shadow:      0 24px 60px -30px rgba(23,26,43,.35);
    color-scheme: light;
  }
}

:root[data-theme="light"] {
  --ground:      #F4F5FB;
  --ground-2:    #FFFFFF;
  --card:        #FFFFFF;
  --card-top:    #FFFFFF;
  --stroke:      rgba(18,20,31,.10);
  --stroke-firm: rgba(18,20,31,.18);
  --text:        #12141F;
  --muted:       #5C6377;
  --violet:      #5B3FD9;
  --violet-soft: #7C5CFF;
  --cyan:        #0E8CA8;
  --rose:        #D63C71;
  --danger:      #C0392B;
  --wash-1:      rgba(124,92,255,.14);
  --wash-2:      rgba(14,140,168,.10);
  --btn-text:    #FFFFFF;
  --shadow:      0 24px 60px -30px rgba(23,26,43,.35);
  color-scheme: light;
}

* { box-sizing: border-box; }

/* Component display rules below outrank the UA's [hidden] rule, so state it
   here where it cannot be silently overridden. */
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--ground);
  background-image:
    radial-gradient(900px 620px at 0% -10%,  var(--wash-1), transparent 70%),
    radial-gradient(760px 560px at 100% 110%, var(--wash-2), transparent 70%);
  background-attachment: fixed;
  color: var(--text);
  font-family: "Heebo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: var(--step-0);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: 100%;
  max-width: 560px;
  margin-inline: auto;
  padding: 34px 20px 64px;
  display: flex;
  flex-direction: column;
  gap: 26px;
}

/* ---------------------------------------------------------------- header -- */
.masthead { display: flex; align-items: flex-start; gap: 14px; }
.masthead__text { flex: 1; min-width: 0; }

h1 {
  font-family: "Bricolage Grotesque", "Heebo", sans-serif;
  font-weight: 800;
  font-size: var(--step-3);
  letter-spacing: -.035em;
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
}
.tagline { margin: 6px 0 0; color: var(--muted); font-size: var(--step-0); }

/* ------------------------------------------------------------ theme knob -- */
.theme {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border: 1px solid var(--stroke);
  border-radius: 999px;
  background: color-mix(in srgb, var(--card) 70%, transparent);
  flex: none;
}
.theme button {
  border: 0;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 15px;
  line-height: 1;
  padding: 7px 9px;
  border-radius: 999px;
  cursor: pointer;
}
.theme button[aria-pressed="true"] {
  background: var(--violet);
  color: var(--btn-text);
}

/* ------------------------------------------------------------ glass card -- */
.card {
  border: 1px solid var(--stroke);
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--card-top), var(--card));
  box-shadow: var(--shadow);
}

.stage { padding: 34px 18px 26px; text-align: center; }

/* ------------------------------------------------------------- the clock -- */
.clock {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.unit { min-width: 0; }

.unit__value {
  font-family: "Bricolage Grotesque", "Heebo", sans-serif;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-size: clamp(2.1rem, 12.5vw, 3.35rem);
  line-height: 1.02;
  letter-spacing: -.05em;
  display: block;
}
.unit--days .unit__value { color: var(--violet-soft); }

.unit__label {
  display: block;
  margin-top: 8px;
  font-size: .66rem;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--muted);
}

/* One digit changing per second: animate only the unit that actually moved. */
@keyframes rise {
  from { transform: translateY(38%); opacity: 0; }
  to   { transform: translateY(0);   opacity: 1; }
}
.unit__value.is-ticking { animation: rise .34s cubic-bezier(.22,.9,.28,1); }

.meta { margin-top: 26px; }
.meta__title {
  font-size: var(--step-1);
  font-weight: 700;
  margin: 0;
  overflow-wrap: anywhere;
}
.meta__when { margin: 4px 0 0; color: var(--muted); font-size: var(--step-0); }

/* ------------------------------------------------------------ zero state -- */
@keyframes breathe {
  from { transform: scale(.94); }
  to   { transform: scale(1.06); }
}
.done__mark { font-size: 3.1rem; display: block; animation: breathe 1.4s ease-in-out infinite alternate; }
.done__text {
  font-family: "Bricolage Grotesque", "Heebo", sans-serif;
  font-weight: 700;
  font-size: var(--step-2);
  margin: 10px 0 0;
}

.blank { padding: 46px 22px; text-align: center; }
.blank__mark { font-size: 2.6rem; display: block; }
.blank__title { font-size: var(--step-1); font-weight: 700; margin: 14px 0 0; }
.blank__sub { color: var(--muted); margin: 4px 0 0; }

/* --------------------------------------------------------------- buttons -- */
.actions { display: flex; flex-direction: column; gap: 10px; }

.btn {
  font: inherit;
  font-weight: 700;
  min-height: 52px;
  padding: 0 20px;
  border-radius: 15px;
  border: 1px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: transform .12s ease, filter .18s ease, background-color .18s ease;
}
.btn:active { transform: scale(.98); }

.btn--primary { background: var(--violet); color: var(--btn-text); }
.btn--primary:hover { filter: brightness(1.1); }

.btn--ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--stroke-firm);
}
.btn--ghost:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }

.btn--text {
  background: none;
  border: 0;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
  padding: 8px 10px;
  border-radius: 10px;
  min-height: 44px;
}
.btn--text:hover { color: var(--text); }
.btn--danger { color: var(--danger); }

:where(button, input, [tabindex]):focus-visible {
  outline: 2px solid var(--violet-soft);
  outline-offset: 2px;
}

/* ------------------------------------------------------------------ list -- */
.section__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
h2 {
  font-family: "Bricolage Grotesque", "Heebo", sans-serif;
  font-size: var(--step-2);
  font-weight: 700;
  letter-spacing: -.03em;
  margin: 0;
}
.count { color: var(--muted); font-size: var(--step--1); font-variant-numeric: tabular-nums; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

.row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 13px 12px 13px 15px;
  border: 1px solid var(--stroke);
  border-radius: var(--radius-sm);
  background: var(--card);
}
.row--pinned { border-color: color-mix(in srgb, var(--violet) 55%, transparent); }

.row__mark { font-size: 1.45rem; line-height: 1; }
.row__body { min-width: 0; }
.row__title {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row__left {
  color: var(--violet-soft);
  font-variant-numeric: tabular-nums;
  font-size: var(--step-0);
}
.row__date { color: var(--muted); font-size: var(--step--1); }
.row__tools { display: flex; gap: 2px; }

.icon {
  width: 40px;
  height: 40px;
  display: inline-grid;
  place-items: center;
  border: 0;
  background: none;
  color: var(--muted);
  border-radius: 11px;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
}
.icon:hover { background: color-mix(in srgb, var(--text) 9%, transparent); color: var(--text); }
.icon[aria-pressed="true"] { color: var(--cyan); }
.icon[aria-pressed="true"] svg { fill: currentColor; }
.icon svg { display: block; }

/* ---------------------------------------------------------------- dialog -- */
dialog {
  border: 1px solid var(--stroke);
  border-radius: 24px;
  background: var(--ground-2);
  color: var(--text);
  padding: 0;
  width: min(460px, calc(100vw - 28px));
  box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(4,5,12,.68); backdrop-filter: blur(3px); }

.sheet { padding: 24px 22px 22px; display: flex; flex-direction: column; gap: 16px; }
.sheet h3 {
  font-family: "Bricolage Grotesque", "Heebo", sans-serif;
  font-size: var(--step-2);
  font-weight: 700;
  letter-spacing: -.03em;
  margin: 0;
}

.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field > span { font-size: var(--step--1); font-weight: 500; color: var(--muted); letter-spacing: .04em; }

input[type="text"], input[type="date"], input[type="time"] {
  font: inherit;
  min-width: 0;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--stroke-firm);
  border-radius: 13px;
  padding: 13px 14px;
  width: 100%;
  min-height: 50px;
}
input::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
input:focus-visible { border-color: var(--violet); outline: none; box-shadow: 0 0 0 3px var(--wash-1); }
input[aria-invalid="true"] { border-color: var(--danger); }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 380px) { .pair { grid-template-columns: 1fr; } }

.err { color: var(--danger); font-size: var(--step--1); min-height: 0; }
.err:empty { display: none; }

.marks { display: flex; flex-wrap: wrap; gap: 7px; }
.mark {
  font-size: 1.2rem;
  line-height: 1;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 1px solid var(--stroke);
  background: transparent;
  cursor: pointer;
}
.mark[aria-pressed="true"] {
  border-color: var(--violet);
  background: var(--wash-1);
}

.switch {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  padding: 12px 14px;
  border: 1px solid var(--stroke);
  border-radius: 13px;
  cursor: pointer;
}
.switch span { font-size: var(--step-0); }
.switch input { width: 20px; height: 20px; accent-color: var(--violet); flex: none; cursor: pointer; }

.sheet__foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
.sheet__foot #cancel { flex: 0 1 auto; }
.sheet__foot #save { flex: 1 1 auto; white-space: nowrap; }

/* ----------------------------------------------------------------- toast -- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translate(-50%, calc(100% + 30px));
  opacity: 0;
  pointer-events: none;
  background: var(--card-top);
  color: var(--text);
  border: 1px solid var(--stroke-firm);
  border-radius: 13px;
  padding: 12px 18px;
  box-shadow: var(--shadow);
  transition: transform .3s cubic-bezier(.22,.9,.28,1), opacity .3s ease;
  z-index: 10;
  max-width: calc(100vw - 32px);
  text-align: center;
}
.toast.is-up { transform: translate(-50%, 0); opacity: 1; }

.foot { color: var(--muted); font-size: var(--step--1); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>

</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead__text">
      <h1>Pulse Countdown</h1>
      <p class="tagline">What's your next moment?</p>
    </div>
    <div class="theme" role="group" aria-label="Theme">
      <button type="button" data-theme-set="light" aria-pressed="false" title="Light">☀</button>
      <button type="button" data-theme-set="dark"  aria-pressed="false" title="Dark">☾</button>
      <button type="button" data-theme-set="system" aria-pressed="true" title="System">◐</button>
    </div>
  </header>

  <main class="card" id="stage" aria-live="polite"></main>

  <div class="actions">
    <button type="button" class="btn btn--primary" id="new">+ New Countdown</button>
    <button type="button" class="btn btn--ghost" id="edit" hidden>Edit</button>
  </div>

  <section>
    <div class="section__head">
      <h2>My Countdowns</h2>
      <span class="count" id="count"></span>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <p class="foot">Saved on this device · works offline</p>
</div>

<dialog id="sheet">
  <form class="sheet" method="dialog" id="form" novalidate>
    <h3 id="sheetTitle">New Countdown</h3>

    <label class="field">
      <span>NAME</span>
      <input type="text" id="fTitle" placeholder="למשל: יום הולדת" autocomplete="off" maxlength="60">
      <em class="err" id="eTitle"></em>
    </label>

    <div class="field">
      <span>ICON</span>
      <div class="marks" id="marks" role="group" aria-label="Icon"></div>
    </div>

    <div class="pair">
      <label class="field">
        <span>DATE</span>
        <input type="date" id="fDate">
      </label>
      <label class="field">
        <span>TIME</span>
        <input type="time" id="fTime">
      </label>
    </div>
    <em class="err" id="eWhen"></em>

    <label class="switch">
      <span>Notify me when it reaches zero</span>
      <input type="checkbox" id="fNotify">
    </label>

    <div class="sheet__foot">
      <button type="button" class="btn btn--ghost" id="cancel">Cancel</button>
      <button type="submit" class="btn btn--primary" id="save">Create Countdown</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const STORE = "pulse.countdowns.v1";
  const THEME = "pulse.theme.v1";
  const MARKS = ["🎯","🎂","🎉","✈️","💍","🎓","🏖️","🚀","❤️","🎄"];
  const UNITS = [
    { key: "d", label: "ימים",  cls: "unit--days" },
    { key: "h", label: "שעות",  cls: "" },
    { key: "m", label: "דקות",  cls: "" },
    { key: "s", label: "שניות", cls: "" }
  ];

  const $ = (id) => document.getElementById(id);

  const svg = (body) =>
    `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true" focusable="false">${body}</svg>`;

  const ICON = {
    star:   svg('<path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/>'),
    pencil: svg('<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 6.5l3 3"/>'),
    cross:  svg('<path d="M6 6l12 12M18 6L6 18"/>')
  };

  /* ---- storage. Every read is defensive: a corrupt or hand-edited payload
         yields an empty list rather than a page that refuses to boot. ------- */
  const isSane = (c) =>
    c && typeof c === "object" &&
    typeof c.id === "string" &&
    typeof c.title === "string" &&
    Number.isFinite(c.target);

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.filter(isSane) : [];
    } catch (_) {
      return [];
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORE, JSON.stringify(items));
    } catch (_) {
      toast("Couldn't save — this browser is blocking storage");
    }
  }

  let items = load();
  let editingId = null;
  let pickedMark = MARKS[0];
  let timer = null;
  const fired = new Set();

  /* ---- countdown math -------------------------------------------------- */
  /* Always target - now from two absolute timestamps, never a decrementing
     counter, so a late tick or a backgrounded tab costs no accuracy. Every
     value is an integer clamped at zero, so NaN can never reach the DOM. */
  function remaining(target, now) {
    const diff = target - now;
    if (!Number.isFinite(diff) || diff <= 0) {
      return { d: 0, h: 0, m: 0, s: 0, total: 0, done: true };
    }
    const t = Math.floor(diff / 1000);
    return {
      d: Math.floor(t / 86400),
      h: Math.floor((t % 86400) / 3600),
      m: Math.floor((t % 3600) / 60),
      s: t % 60,
      total: diff,
      done: false
    };
  }

  const pad = (n) => (n < 10 ? "0" + n : String(n));
  const compact = (r) => `${r.d}d ${pad(r.h)}h ${pad(r.m)}m ${pad(r.s)}s`;

  const fullWhen = (ms) => {
    const d = new Date(ms);
    const date = d.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
    const time = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", hour12: false });
    return `${date} • ${time}`;
  };

  const shortWhen = (ms) => new Date(ms).toLocaleDateString(undefined, {
    day: "numeric", month: "short", year: "numeric"
  });

  /* ---- ordering: soonest first, finished ones sink ---------------------- */
  function ordered() {
    const now = Date.now();
    return [...items].sort((a, b) =>
      (a.target <= now) - (b.target <= now) || a.target - b.target
    );
  }

  const pinned = () => items.find((c) => c.pinned) || ordered()[0] || null;

  /* ---- rendering ------------------------------------------------------- */
  function stageMarkup(c, r) {
    if (!c) {
      return `<div class="blank">
        <span class="blank__mark">⏳</span>
        <p class="blank__title">No countdown yet</p>
        <p class="blank__sub">Create your first moment.</p>
      </div>`;
    }
    const face = r.done
      ? `<div><span class="done__mark">🎉</span><p class="done__text">It's time!</p></div>`
      : `<div class="clock">${UNITS.map((u) => `
          <div class="unit ${u.cls}">
            <span class="unit__value" data-unit="${u.key}">${u.key === "d" ? r.d : pad(r[u.key])}</span>
            <span class="unit__label">${u.label}</span>
          </div>`).join("")}</div>`;

    return `<div class="stage">
      ${face}
      <div class="meta">
        <p class="meta__title">${esc(c.mark)} ${esc(c.title)}</p>
        <p class="meta__when">${esc(fullWhen(c.target))}</p>
      </div>
    </div>`;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (m) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  let stageKey = "";

  function paint() {
    const now = Date.now();
    const c = pinned();
    const r = c ? remaining(c.target, now) : null;

    // Rebuild the stage only when its shape changes; on a normal tick just
    // swap the digits, so we are not throwing away the DOM every second.
    const key = c ? `${c.id}|${c.target}|${c.title}|${c.mark}|${r.done}` : "empty";
    if (key !== stageKey) {
      stageKey = key;
      $("stage").innerHTML = stageMarkup(c, r);
      $("edit").hidden = !c;
    } else if (c && !r.done) {
      for (const u of UNITS) {
        const el = $("stage").querySelector(`[data-unit="${u.key}"]`);
        if (!el) continue;
        const next = u.key === "d" ? String(r.d) : pad(r[u.key]);
        if (el.textContent !== next) {
          el.textContent = next;
          el.classList.remove("is-ticking");
          void el.offsetWidth;           // restart the animation
          el.classList.add("is-ticking");
        }
      }
    }

    paintList(now);
    ring(now);
  }

  function paintList(now) {
    const rows = ordered();
    $("count").textContent = rows.length ? `${rows.length}` : "";

    if (!rows.length) {
      $("list").innerHTML = `<li class="row" style="justify-items:center;grid-template-columns:1fr">
        <span class="row__date">Nothing here yet — create your first countdown above.</span></li>`;
      return;
    }

    $("list").innerHTML = rows.map((c) => {
      const r = remaining(c.target, now);
      const isPinned = pinned() && pinned().id === c.id;
      return `<li class="row ${isPinned ? "row--pinned" : ""}" data-id="${esc(c.id)}">
        <span class="row__mark">${esc(c.mark)}</span>
        <div class="row__body">
          <div class="row__title">${esc(c.title)}</div>
          <div class="row__left">${r.done ? "🎉 It's time!" : compact(r)}</div>
          <div class="row__date">${esc(shortWhen(c.target))}</div>
        </div>
        <div class="row__tools">
          <button type="button" class="icon" data-act="pin" aria-pressed="${isPinned}"
                  title="Show on top" aria-label="Show ${esc(c.title)} at the top">${ICON.star}</button>
          <button type="button" class="icon" data-act="edit"
                  title="Edit" aria-label="Edit ${esc(c.title)}">${ICON.pencil}</button>
          <button type="button" class="icon" data-act="del"
                  title="Delete" aria-label="Delete ${esc(c.title)}">${ICON.cross}</button>
        </div>
      </li>`;
    }).join("");
  }

  /* ---- notifications: local only, no server ---------------------------- */
  function ring(now) {
    for (const c of items) {
      if (!c.notify || fired.has(c.id) || c.target > now) continue;
      fired.add(c.id);
      if (typeof Notification !== "undefined" && Notification.permission === "granted") {
        try {
          new Notification("🎉 It's time!", { body: `Your countdown "${c.title}" has reached zero.` });
        } catch (_) { /* some browsers refuse outside a service worker */ }
      }
    }
  }

  /* ---- ticking: aligned to the wall clock, paused when hidden ---------- */
  function tick() {
    paint();
    const delay = 1000 - (Date.now() % 1000);
    timer = setTimeout(tick, delay);
  }

  function start() { if (timer === null) tick(); }
  function stop() { clearTimeout(timer); timer = null; }

  document.addEventListener("visibilitychange", () => {
    // Nothing to recover on resume: the next paint recomputes from timestamps.
    document.hidden ? stop() : start();
  });

  /* ---- editor ---------------------------------------------------------- */
  function paintMarks() {
    $("marks").innerHTML = MARKS.map((m) =>
      `<button type="button" class="mark" data-mark="${m}" aria-pressed="${m === pickedMark}"
               aria-label="Icon ${m}">${m}</button>`).join("");
  }

  function openSheet(c) {
    editingId = c ? c.id : null;
    pickedMark = c ? c.mark : MARKS[0];

    $("sheetTitle").textContent = c ? "Edit Countdown" : "New Countdown";
    $("save").textContent = c ? "Save Changes" : "Create Countdown";
    $("fTitle").value = c ? c.title : "";
    $("fNotify").checked = c ? !!c.notify : false;

    const d = c ? new Date(c.target) : null;
    $("fDate").value = d ? toDateValue(d) : "";
    $("fTime").value = d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : "";
    $("fDate").min = toDateValue(new Date());

    clearErrors();
    paintMarks();
    $("sheet").showModal();
    $("fTitle").focus();
  }

  const toDateValue = (d) =>
    `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  function clearErrors() {
    $("eTitle").textContent = "";
    $("eWhen").textContent = "";
    $("fTitle").removeAttribute("aria-invalid");
    $("fDate").removeAttribute("aria-invalid");
    $("fTime").removeAttribute("aria-invalid");
  }

  function submit(ev) {
    ev.preventDefault();
    clearErrors();

    const title = $("fTitle").value.trim();
    const date = $("fDate").value;
    const time = $("fTime").value;
    let bad = false;

    if (!title) {
      $("eTitle").textContent = "Please enter a name.";
      $("fTitle").setAttribute("aria-invalid", "true");
      bad = true;
    }
    if (!date || !time) {
      $("eWhen").textContent = "Please pick both a date and a time.";
      if (!date) $("fDate").setAttribute("aria-invalid", "true");
      if (!time) $("fTime").setAttribute("aria-invalid", "true");
      bad = true;
    }
    if (bad) return;

    const target = new Date(`${date}T${time}`).getTime();
    if (!Number.isFinite(target)) {
      $("eWhen").textContent = "That date and time can't be read.";
      bad = true;
    } else if (target <= Date.now()) {
      $("eWhen").textContent = "That moment is already in the past.";
      $("fDate").setAttribute("aria-invalid", "true");
      $("fTime").setAttribute("aria-invalid", "true");
      bad = true;
    }
    if (bad) return;

    const notify = $("fNotify").checked;
    if (notify) askPermission();

    if (editingId) {
      const c = items.find((x) => x.id === editingId);
      if (c) {
        Object.assign(c, { title, target, mark: pickedMark, notify });
        fired.delete(c.id);
      }
      toast("Countdown updated");
    } else {
      items.push({
        id: String(Date.now()) + Math.random().toString(16).slice(2, 8),
        title, target, mark: pickedMark, notify,
        pinned: items.length === 0
      });
      toast("Countdown created");
    }

    persist();
    stageKey = "";
    paint();
    $("sheet").close();
  }

  function askPermission() {
    if (typeof Notification === "undefined") return;
    if (Notification.permission === "default") {
      Notification.requestPermission().then((p) => {
        if (p !== "granted") toast("Notifications are blocked for this page");
      });
    } else if (Notification.permission === "denied") {
      toast("Notifications are blocked for this page");
    }
  }

  /* ---- toast ----------------------------------------------------------- */
  let toastTimer;
  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("is-up");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("is-up"), 2600);
  }

  /* ---- theme ----------------------------------------------------------- */
  function applyTheme(mode) {
    if (mode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);

    document.querySelectorAll("[data-theme-set]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.themeSet === mode)));

    try { localStorage.setItem(THEME, mode); } catch (_) { /* storage blocked */ }
  }

  /* ---- wiring ---------------------------------------------------------- */
  $("new").addEventListener("click", () => openSheet(null));
  $("edit").addEventListener("click", () => { const c = pinned(); if (c) openSheet(c); });
  $("cancel").addEventListener("click", () => $("sheet").close());
  $("form").addEventListener("submit", submit);

  $("marks").addEventListener("click", (e) => {
    const b = e.target.closest("[data-mark]");
    if (!b) return;
    pickedMark = b.dataset.mark;
    paintMarks();
  });

  $("list").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const id = btn.closest("[data-id]").dataset.id;
    const c = items.find((x) => x.id === id);
    if (!c) return;

    if (btn.dataset.act === "pin") {
      items.forEach((x) => { x.pinned = x.id === id; });
    } else if (btn.dataset.act === "edit") {
      openSheet(c);
      return;
    } else if (btn.dataset.act === "del") {
      if (!confirm(`Delete "${c.title}"?`)) return;
      items = items.filter((x) => x.id !== id);
      if (!items.some((x) => x.pinned) && items.length) items[0].pinned = true;
      toast("Countdown deleted");
    }

    persist();
    stageKey = "";
    paint();
  });

  document.querySelectorAll("[data-theme-set]").forEach((b) =>
    b.addEventListener("click", () => applyTheme(b.dataset.themeSet)));

  /* ---- boot ------------------------------------------------------------ */
  let saved = "system";
  try { saved = localStorage.getItem(THEME) || "system"; } catch (_) { /* blocked */ }
  applyTheme(saved);

  // Anything already past at load has had its moment; don't fire stale alerts.
  const now0 = Date.now();
  items.forEach((c) => { if (c.target <= now0) fired.add(c.id); });

  paintMarks();
  start();
})();
</script>
</body>
</html>
