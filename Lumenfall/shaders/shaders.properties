profile.INSANE      = shadowMapResolution=8192 shadowDistance=384.0 SHADOW_FILTER=2 SHADOW_SAMPLES=48 SHADOW_BLOCKER_SAMPLES=16 COLORED_SHADOWS SCREEN_SPACE_SHADOWS ENTITY_SHADOWS AO_SAMPLES=16 POM POM_SAMPLES=192 WATER_WAVE_OCTAVES=10 WATER_PARALLAX SSR_STEPS=96 SSR_REFINE_STEPS=10 ROUGH_REFLECTIONS REFLECTION_CLOUDS ATMOSPHERE_STEPS=24 VL_STEPS=64 CLOUD_STEPS=128 CLOUD_LIGHT_STEPS=10 CLOUD_DETAIL=3 CLOUD_TEMPORAL=2 CIRRUS_CLOUDS !DOF DOF_SAMPLES=96 !MOTION_BLUR MOTION_BLUR_SAMPLES=24 LENS_FLARE ANAMORPHIC_STREAKS=0.0 LETTERBOX=0.0 FILM_GRAIN=0.0 CHROMATIC_ABERRATION=0.0 VIGNETTE=0.35
profile.CINEMATIC   = shadowMapResolution=8192 shadowDistance=384.0 SHADOW_FILTER=2 SHADOW_SAMPLES=64 SHADOW_BLOCKER_SAMPLES=24 COLORED_SHADOWS SCREEN_SPACE_SHADOWS ENTITY_SHADOWS AO_SAMPLES=24 POM POM_SAMPLES=256 WATER_WAVE_OCTAVES=12 WATER_PARALLAX SSR_STEPS=128 SSR_REFINE_STEPS=12 ROUGH_REFLECTIONS REFLECTION_CLOUDS ATMOSPHERE_STEPS=32 VL_STEPS=96 CLOUD_STEPS=192 CLOUD_LIGHT_STEPS=12 CLOUD_DETAIL=3 CLOUD_TEMPORAL=1 CIRRUS_CLOUDS DOF DOF_SAMPLES=128 MOTION_BLUR MOTION_BLUR_SAMPLES=32 LENS_FLARE ANAMORPHIC_STREAKS=0.3 LETTERBOX=2.39 FILM_GRAIN=0.1 CHROMATIC_ABERRATION=0.2 VIGNETTE=0.5

#------------------------------------------------------------------------------------
# Menu
#------------------------------------------------------------------------------------
screen = [INFO] <profile> <empty> <empty> [S_SHADOWS] [S_LIGHTING] [S_WATER] [S_REFLECTIONS] [S_VOLUMETRICS] [S_CLOUDS] [S_SKY] [S_MATERIALS] [S_BLOOM] [S_DOF] [S_MOTION_BLUR] [S_TAA] [S_COLOR] [S_DIMENSIONS]
screen.columns = 2

screen.INFO = LUMENFALL_VERSION

screen.S_SHADOWS = SHADOWS shadowMapResolution shadowDistance sunPathRotation SHADOW_FILTER SHADOW_SOFTNESS SHADOW_SAMPLES SHADOW_BLOCKER_SAMPLES COLORED_SHADOWS SCREEN_SPACE_SHADOWS ENTITY_SHADOWS SSS_STRENGTH

screen.S_LIGHTING = SUN_INTENSITY MOON_INTENSITY AMBIENT_INTENSITY MIN_LIGHT <empty> <empty> BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMP BLOCKLIGHT_FLICKER HANDHELD_LIGHT EMISSIVE_STRENGTH LIGHTNING_FLASH <empty> <empty> AO_ENABLED AO_STRENGTH AO_SAMPLES AO_RADIUS VANILLA_AO_STRENGTH

screen.S_WATER = WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_WAVE_SCALE WATER_WAVE_OCTAVES WATER_VERTEX_WAVES WATER_PARALLAX RAIN_RIPPLES <empty> WATER_REFRACTION WATER_REFRACTION_STRENGTH WATER_CAUSTICS WATER_CAUSTICS_STRENGTH WATER_FOAM WATER_FOAM_STRENGTH <empty> <empty> WATER_FOG_DENSITY WATER_BIOME_TINT WATER_ABSORB_R WATER_ABSORB_G WATER_ABSORB_B UNDERWATER_VL UNDERWATER_DISTORTION

screen.S_REFLECTIONS = SSR SSR_STEPS SSR_REFINE_STEPS ROUGH_REFLECTIONS PBR_REFLECTIONS SKY_REFLECTIONS REFLECTION_CLOUDS RAIN_PUDDLES PUDDLE_AMOUNT

screen.S_VOLUMETRICS = VOLUMETRIC_LIGHT VL_STEPS VL_STRENGTH VL_NIGHT_STRENGTH <empty> <empty> ATMOSPHERE_STEPS FOG_DENSITY HEIGHT_FOG HEIGHT_FOG_DENSITY RAIN_FOG_DENSITY CAVE_FOG BORDER_FOG

screen.S_CLOUDS = VOLUMETRIC_CLOUDS CLOUD_TEMPORAL CLOUD_STEPS CLOUD_LIGHT_STEPS CLOUD_DETAIL CLOUD_SHADOWS <empty> <empty> CLOUD_COVERAGE CLOUD_DENSITY CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SCALE CLOUD_SPEED CIRRUS_CLOUDS

screen.S_SKY = SUN_SIZE MOON_SIZE STARS STAR_AMOUNT MILKY_WAY MILKY_WAY_STRENGTH SHOOTING_STARS AURORA RAINBOWS

screen.S_MATERIALS = PBR_MODE SPECULAR_HIGHLIGHTS NORMAL_MAPPING NORMAL_STRENGTH GENERATED_NORMALS <empty> <empty> <empty> POM POM_DEPTH POM_SAMPLES POM_DISTANCE POM_SHADOWS <empty> <empty> <empty> WAVING_PLANTS WAVING_STRENGTH WAVING_SPEED

screen.S_BLOOM = BLOOM BLOOM_STRENGTH BLOOM_RADIUS ANAMORPHIC_STREAKS LENS_FLARE LENS_FLARE_STRENGTH

screen.S_DOF = DOF DOF_FOCUS_MODE DOF_FOCUS_DISTANCE centerDepthHalflife DOF_INTENSITY DOF_MAX_RADIUS DOF_SAMPLES DOF_BLADES DOF_BOKEH_HIGHLIGHTS DOF_CHROMATIC DOF_NEAR_BLUR

screen.S_MOTION_BLUR = MOTION_BLUR MOTION_BLUR_STRENGTH MOTION_BLUR_SAMPLES

screen.S_TAA = TAA TAA_BLEND SHARPENING

screen.S_COLOR = AUTO_EXPOSURE EXPOSURE AE_SPEED TONEMAP <empty> <empty> CONTRAST SATURATION VIBRANCE WHITE_BALANCE SPLIT_TONING PURKINJE <empty> <empty> VIGNETTE FILM_GRAIN CHROMATIC_ABERRATION LETTERBOX

screen.S_DIMENSIONS = NETHER_FOG_DENSITY NETHER_HEAT_HAZE END_NEBULA END_FOG_DENSITY

sliders = shadowMapResolution shadowDistance sunPathRotation SHADOW_SAMPLES SHADOW_BLOCKER_SAMPLES SHADOW_SOFTNESS SSS_STRENGTH \
    SUN_INTENSITY MOON_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMP EMISSIVE_STRENGTH MIN_LIGHT AO_SAMPLES AO_RADIUS AO_STRENGTH VANILLA_AO_STRENGTH \
    NORMAL_STRENGTH POM_DEPTH POM_SAMPLES POM_DISTANCE WAVING_STRENGTH WAVING_SPEED PUDDLE_AMOUNT \
    WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_WAVE_SCALE WATER_WAVE_OCTAVES WATER_REFRACTION_STRENGTH WATER_CAUSTICS_STRENGTH WATER_FOAM_STRENGTH WATER_FOG_DENSITY WATER_BIOME_TINT WATER_ABSORB_R WATER_ABSORB_G WATER_ABSORB_B \
    SSR_STEPS SSR_REFINE_STEPS ATMOSPHERE_STEPS FOG_DENSITY HEIGHT_FOG_DENSITY RAIN_FOG_DENSITY VL_STEPS VL_STRENGTH VL_NIGHT_STRENGTH \
    CLOUD_STEPS CLOUD_LIGHT_STEPS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SCALE CLOUD_SPEED \
    SUN_SIZE MOON_SIZE STAR_AMOUNT MILKY_WAY_STRENGTH \
    TAA_BLEND SHARPENING BLOOM_STRENGTH BLOOM_RADIUS ANAMORPHIC_STREAKS LENS_FLARE_STRENGTH \
    DOF_FOCUS_DISTANCE DOF_INTENSITY DOF_MAX_RADIUS DOF_SAMPLES DOF_BOKEH_HIGHLIGHTS centerDepthHalflife \
    MOTION_BLUR_STRENGTH MOTION_BLUR_SAMPLES \
    EXPOSURE AE_SPEED CONTRAST SATURATION VIBRANCE WHITE_BALANCE SPLIT_TONING VIGNETTE FILM_GRAIN CHROMATIC_ABERRATION LETTERBOX \
    NETHER_FOG_DENSITY END_FOG_DENSITY

#------------------------------------------------------------------------------------
# Pipeline
#------------------------------------------------------------------------------------
oldLighting = false
oldHandLight = false
separateAo = true
underwaterOverlay = false
vignette = false
sun = false
moon = false
dynamicHandLight = true
rain.depth = false
beacon.beam.depth = true
particles.ordering = after
supportsColorCorrection = true

shadowTerrain = true
shadowTranslucent = true
shadowBlockEntities = true
shadowPlayer = true
#ifdef ENTITY_SHADOWS
    shadowEntities = true
#else
    shadowEntities = false
#endif

#ifdef VOLUMETRIC_CLOUDS
    clouds = off
#else
    clouds = fancy
#endif

# Opaque geometry writes the G-buffer: no blending
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.gbuffers_entities = off
blend.gbuffers_entities_glowing = off
blend.gbuffers_hand = off

# Translucent surface data must not be blended
blend.gbuffers_water.colortex6 = off
blend.gbuffers_hand_water.colortex6 = off
blend.gbuffers_entities_translucent.colortex6 = off
blend.gbuffers_block_translucent.colortex6 = off

# Emissive overlays are additive
blend.gbuffers_spidereyes = SRC_ALPHA ONE ONE ONE
blend.gbuffers_beaconbeam = SRC_ALPHA ONE ONE ONE
blend.gbuffers_lightning = SRC_ALPHA ONE ONE ONE

alphaTest.gbuffers_water = off
alphaTest.gbuffers_weather = GREATER 0.002
alphaTest.gbuffers_textured = GREATER 0.002

# Effects that can be switched off entirely skip their pass
#ifndef SHADOWS
    program.world0/shadow.enabled = false
    program.world1/shadow.enabled = false
#endif
program.world-1/shadow.enabled = false
#ifndef VOLUMETRIC_CLOUDS
    program.world0/deferred.enabled = false
#endif
program.world-1/deferred.enabled = false
program.world1/deferred.enabled = false
#ifndef TAA
    program.world0/composite2.enabled = false
    program.world-1/composite2.enabled = false
    program.world1/composite2.enabled = false
#endif
#ifndef DOF
    program.world0/composite3.enabled = false
    program.world-1/composite3.enabled = false
    program.world1/composite3.enabled = false
#endif
#ifndef MOTION_BLUR
    program.world0/composite4.enabled = false
    program.world-1/composite4.enabled = false
    program.world1/composite4.enabled = false
#endif
#ifndef BLOOM
    program.world0/composite5.enabled = false
    program.world-1/composite5.enabled = false
    program.world1/composite5.enabled = false
#endif

#------------------------------------------------------------------------------------
# Textures
#------------------------------------------------------------------------------------
texture.noise = textures/noise.png

#------------------------------------------------------------------------------------
# Custom uniforms
#------------------------------------------------------------------------------------
uniform.float.lf_rain = smooth(1, rainStrength, 4, 6)
uniform.float.lf_eyeSky = eyeBrightnessSmooth.y / 240.0
uniform.float.lf_caveFactor = if(isEyeInWater == 0, clamp(1.0 - eyeBrightnessSmooth.y / 120.0, 0.0, 1.0) * clamp((72.0 - eyeAltitude) / 16.0, 0.0, 1.0), 0.0)
uniform.float.lf_snowyBiome = smooth(2, if(in(biome_precipitation, 2), 1, 0), 20, 10)
uniform.float.lf_dryBiome = smooth(3, if(in(biome_precipitation, 0), 1, 0), 20, 10)
uniform.float.lf_netherWastes = smooth(4, if(in(biome, BIOME_NETHER_WASTES), 1, 0), 10, 10)
uniform.float.lf_crimson = smooth(5, if(in(biome, BIOME_CRIMSON_FOREST), 1, 0), 10, 10)
uniform.float.lf_warped = smooth(6, if(in(biome, BIOME_WARPED_FOREST), 1, 0), 10, 10)
uniform.float.lf_basalt = smooth(7, if(in(biome, BIOME_BASALT_DELTAS), 1, 0), 10, 10)
uniform.float.lf_soulValley = smooth(8, if(in(biome, BIOME_SOUL_SAND_VALLEY), 1, 0), 10, 10)
uniform.float.lf_frameTimeSmooth = smooth(9, frameTime, 1, 1)
