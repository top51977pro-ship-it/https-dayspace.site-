name: Deploy Golden XI website

# Publishes the playable web build (golden-xi/www) to a `gh-pages` branch. GitHub
# Pages then serves it at a public URL playable from any phone browser — including
# iPhone/Safari, which cannot install APKs.
#
# ONE-TIME SETUP (a human must do this once, the workflow token cannot):
#   Repo Settings → Pages → Build and deployment → Source: "Deploy from a branch"
#   → Branch: gh-pages / (root) → Save.
# After that the site auto-updates on every push and lives at:
#   https://top51977pro-ship-it.github.io/https-dayspace.site-/

on:
  push:
    branches: ['**']
    paths:
      - 'golden-xi/www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish golden-xi/www to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./golden-xi/www
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy Golden XI web build"
