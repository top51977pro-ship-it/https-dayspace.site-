name: Deploy Golden XI website

# Publishes the playable web build (golden-xi/www) to GitHub Pages so it can be
# played from any phone browser — including iPhone/Safari, which cannot install APKs.

on:
  push:
    branches: ['**']
    paths:
      - 'golden-xi/www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: golden-xi/www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
