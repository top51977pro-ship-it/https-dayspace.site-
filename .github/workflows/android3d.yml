name: Build Golden XI 3D (native)

# Builds the native OpenGL (libGDX) 3D football APK on GitHub's runners and
# publishes it as GoldenXI-3D.apk on the `apk-3d-latest` release, with a direct
# public download link. Separate from the 2.5D build so both stay installable.

on:
  push:
    branches: ['**']
    paths:
      - 'golden-xi-3d/**'
      - '.github/workflows/android3d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-3d-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build native 3D debug APK
        working-directory: golden-xi-3d
        run: |
          chmod +x gradlew
          ./gradlew :android:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp golden-xi-3d/android/build/outputs/apk/debug/android-debug.apk GoldenXI-3D.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-xi-3d-apk
          path: GoldenXI-3D.apk
          if-no-files-found: error

      - name: Publish to Release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-3d-latest
          name: Golden XI 3D — native (latest)
          body: |
            **Golden XI 3D** · native OpenGL (libGDX) build · direct-install Android APK (debug).

            Real 3D pitch, uniquely-generated fictional players, follow camera,
            on-screen joystick + PASS/SHOOT. Early foundation build — rebuilt on
            every update to `golden-xi-3d/`.
          files: GoldenXI-3D.apk
