name: Build NevoGPT APK

on:
  push:
    branches: ["**"]
    paths:
      - "NevoGPT-Mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: NevoGPT-Mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('NevoGPT-Mobile/**/*.gradle.kts', 'NevoGPT-Mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Show APK output
        run: ls -lR app/build/outputs/apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: NevoGPT-Mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: NevoGPT-Mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Action artifacts are zipped and need a logged-in GitHub account. A release
      # asset is a plain, public, direct-download URL that works from a phone browser:
      #   .../releases/download/android-latest/app-release.apk
      - name: Publish APKs to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk .
          cp app/build/outputs/apk/release/app-release.apk .
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest app-debug.apk app-release.apk --clobber
          else
            gh release create android-latest app-debug.apk app-release.apk \
              --title "NevoGPT — latest Android build" \
              --notes "Automatic build of NevoGPT Mobile. Install \`app-release.apk\` on Android 10+ (allow installs from unknown sources). Signed with the Android debug key. The chat UI works; the AI engine is still a placeholder — see NevoGPT-Mobile/BUILD_REPORT.md." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
