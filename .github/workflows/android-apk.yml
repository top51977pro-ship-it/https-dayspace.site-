name: Build Android APK

# Builds a debug APK in the cloud (GitHub-hosted runner has the Android SDK and
# Google Maven access) and publishes it to a GitHub Release so it can be
# downloaded and installed directly on a phone.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/tanstack-start-capacitor-android-fgbolu
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web (SPA) and sync Capacitor
        run: bun run cap:sync

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk closet-buddy-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: closet-buddy-debug-apk
          path: closet-buddy-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release (for phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Closet Buddy — Android (debug)
          prerelease: true
          files: closet-buddy-debug.apk
          body: |
            Debug APK built from commit ${{ github.sha }}.

            **Install on Android:** open this link on your phone, download the APK,
            allow "install unknown apps" for your browser if prompted, then open it.
            (Debug build — signed with the standard Android debug key.)
