name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which APK to build'
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Write Firebase config
        # Optional: without these secrets the APK ships in local demo mode.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -n "$VITE_FIREBASE_API_KEY" ]; then
            {
              echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY"
              echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN"
              echo "VITE_FIREBASE_DATABASE_URL=$VITE_FIREBASE_DATABASE_URL"
              echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID"
              echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID"
            } > .env
            echo "Firebase configured — building in cloud sync mode."
          else
            echo "No Firebase secrets found — building in demo mode."
          fi

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Point Gradle at the runner SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Decode release keystore
        # Optional: set ANDROID_KEYSTORE_BASE64 + the three password secrets to get
        # a signed release APK. Without them, only the debug APK is produced.
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "HAS_KEYSTORE=1" >> "$GITHUB_ENV"
          fi

      - name: Assemble APK
        env:
          ORG_GRADLE_PROJECT_DAYSPACE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_DAYSPACE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_DAYSPACE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "release" ] && [ "$HAS_KEYSTORE" = "1" ]; then
            ./gradlew assembleRelease --no-daemon -PDAYSPACE_STORE_FILE=release.keystore
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect APK
        run: |
          mkdir -p ../out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} ../out/ \;
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: dayspace-family-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
