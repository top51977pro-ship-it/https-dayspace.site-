name: Build Golden XI APK

# Builds the installable Android APK on GitHub's runners, which ship the Android
# SDK and have full network access to Google's Maven repository. The finished
# app-debug.apk is uploaded as a downloadable workflow artifact.

on:
  push:
    branches: ['**']
    paths:
      - 'golden-xi/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: golden-xi/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-xi-debug-apk
          path: golden-xi/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
