# =====================================================================
#  Aurelia Shaders v1.7 - pack configuration (Iris / OptiFine format)
# =====================================================================

# ---- vanilla features replaced by the pack ----
oldLighting = false
oldHandLight = false
underwaterOverlay = false
vignette = false
sun = false
moon = true
clouds = off
dynamicHandLight = true

# ---- shadow pass ----
shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true

# ---- custom textures ----
texture.noise = textures/noise.png

# ---- blending ----
# translucent layer is stored premultiplied in colortex3
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex1 = off
blend.gbuffers_water.colortex2 = off
blend.gbuffers_textured = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_skytextured = ONE ONE ONE ONE

# never blend G-buffer data
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_entities.colortex1 = off
blend.gbuffers_entities.colortex2 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_block.colortex2 = off
blend.gbuffers_hand.colortex1 = off
blend.gbuffers_hand.colortex2 = off
blend.gbuffers_basic.colortex2 = off
blend.gbuffers_beaconbeam.colortex2 = off
blend.gbuffers_spidereyes.colortex2 = off

# ---- profiles ----
profile.POTATO = shadowMapResolution:1024 shadowDistance:96.0 SHADOW_SAMPLES:4 !COLORED_SHADOWS !SSAO !VOLUMETRIC_LIGHT CLOUD_QUALITY:1 !BLOCK_REFLECTIONS !AURORA !CLOUD_SHADOWS VL_SAMPLES:6
profile.LOW    = shadowMapResolution:1536 shadowDistance:128.0 SHADOW_SAMPLES:8 COLORED_SHADOWS !SSAO VOLUMETRIC_LIGHT CLOUD_QUALITY:1 !BLOCK_REFLECTIONS AURORA CLOUD_SHADOWS VL_SAMPLES:8
profile.MEDIUM = shadowMapResolution:2048 shadowDistance:160.0 SHADOW_SAMPLES:12 COLORED_SHADOWS SSAO VOLUMETRIC_LIGHT CLOUD_QUALITY:2 BLOCK_REFLECTIONS AURORA CLOUD_SHADOWS VL_SAMPLES:12
profile.HIGH   = shadowMapResolution:3072 shadowDistance:192.0 SHADOW_SAMPLES:16 COLORED_SHADOWS SSAO VOLUMETRIC_LIGHT CLOUD_QUALITY:2 BLOCK_REFLECTIONS AURORA CLOUD_SHADOWS VL_SAMPLES:16
profile.ULTRA  = shadowMapResolution:4096 shadowDistance:256.0 SHADOW_SAMPLES:24 COLORED_SHADOWS SSAO VOLUMETRIC_LIGHT CLOUD_QUALITY:3 BLOCK_REFLECTIONS AURORA CLOUD_SHADOWS VL_SAMPLES:24

# ---- option menu ----
screen = <profile> <empty> [LIGHTING] [SHADOWS] [ATMOSPHERE] [CLOUDS] [WATER] [DIMENSIONS] [WAVING] [MOTION_BLUR] [POST]
screen.columns = 2

screen.LIGHTING = SUN_INTENSITY AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH BLOCKLIGHT_STYLE MIN_LIGHT EMISSIVE_STRENGTH HANDHELD_LIGHT GLOWING_ORES SSAO SSAO_STRENGTH SSAO_SAMPLES SUBSURFACE_SCATTERING GENERATED_NORMALS GEN_NORMAL_STRENGTH BLOCK_REFLECTIONS RAIN_PUDDLES SOIL_RETEXTURE ambientOcclusionLevel
screen.SHADOWS = shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS COLORED_SHADOWS WATER_CAUSTICS sunPathRotation CLOUD_SHADOWS
screen.ATMOSPHERE = VOLUMETRIC_LIGHT VL_STRENGTH VL_SAMPLES SUNBEAMS SUNBEAM_STRENGTH FOG_DENSITY BORDER_FOG SUN_SIZE STARS STAR_BRIGHTNESS AURORA AURORA_STRENGTH
screen.CLOUDS = VOLUMETRIC_CLOUDS CLOUD_QUALITY CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SPEED
screen.WATER = WATER_WAVES WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_REFLECTIONS WATER_REFRACTION WATER_OPACITY WATER_FOG_DENSITY
screen.DIMENSIONS = PORTAL_EFFECT PORTAL_BRIGHTNESS DIMENSION_HAZE HAZE_DENSITY END_NEBULA
screen.MOTION_BLUR = MOTION_BLUR MOTION_BLUR_STRENGTH MOTION_BLUR_SAMPLES MOTION_BLUR_MAX_LENGTH MOTION_BLUR_FPS_INDEPENDENT
screen.WAVING = WAVING_PLANTS WAVING_LEAVES WAVING_SPEED WAVING_AMPLITUDE
screen.POST = TAA SHARPENING BLOOM BLOOM_STRENGTH EXPOSURE SATURATION VIBRANCE CONTRAST VIGNETTE VIGNETTE_STRENGTH

sliders = shadowMapResolution shadowDistance sunPathRotation ambientOcclusionLevel SHADOW_SAMPLES SHADOW_SOFTNESS \
  SUN_INTENSITY AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH MIN_LIGHT SSAO_STRENGTH SSAO_SAMPLES GEN_NORMAL_STRENGTH EMISSIVE_STRENGTH \
  VL_STRENGTH VL_SAMPLES SUNBEAM_STRENGTH SUN_SIZE CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SPEED STAR_BRIGHTNESS AURORA_STRENGTH FOG_DENSITY \
  WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_OPACITY WATER_FOG_DENSITY WAVING_SPEED WAVING_AMPLITUDE \
  PORTAL_BRIGHTNESS HAZE_DENSITY MOTION_BLUR_STRENGTH MOTION_BLUR_SAMPLES MOTION_BLUR_MAX_LENGTH \
  SHARPENING BLOOM_STRENGTH EXPOSURE SATURATION VIBRANCE CONTRAST VIGNETTE_STRENGTH
