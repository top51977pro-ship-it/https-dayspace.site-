plugins {
    id 'com.android.application'
}

android {
    namespace 'site.goldenxi.game'
    compileSdk 34

    defaultConfig {
        applicationId 'site.goldenxi.game'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }

    packaging {
        resources {
            excludes += ['META-INF/robovm/**', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:1.12.1"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-x86_64"
}

// Extract libGDX native .so files into jniLibs so they ship inside the APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        configurations.natives.files.each { jar ->
            def abi = null
            if (jar.name.endsWith('natives-arm64-v8a.jar'))   abi = 'arm64-v8a'
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) abi = 'armeabi-v7a'
            if (jar.name.endsWith('natives-x86_64.jar'))      abi = 'x86_64'
            if (jar.name.endsWith('natives-x86.jar'))         abi = 'x86'
            if (abi != null) {
                def outputDir = file("src/main/jniLibs/${abi}")
                outputDir.mkdirs()
                copy { from zipTree(jar); into outputDir; include '*.so' }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') task.dependsOn 'copyAndroidNatives'
}
